<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(94, 94, 190);
            margin-right: 10%;
            margin-top: 30%;
            margin-left: 10%;
        }

        .navbar {
            width: 100%;
            height: 10vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid black;
            border-radius: 10px;
            padding: 20px;
        }

        h4 {
            font-size: 30px;
        }

        .navbar ul {
            display: flex;
            list-style: none;
            gap: 50px;
        }

        .navbar ul li a {
            text-decoration: none;
            color: white;
        }

        button {
            border: none;
            width: 80px;
            height: 30px;
            background-color: blueviolet;
            border-radius: 7px;
        }
    </style>
</head>

<body>
    <div class="navbar">
        <div class="logo">
            <h4>Flow</h4>
        </div>
        <div class="nav-links">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Product</a></li>
                <li><a href="#">Docs</a></li>
                <li><a href="#">Blog</a></li>
            </ul>
        </div>
        <div class="nav-btn">
            <button>Sign up</button>
        </div>
    </div>
    <div class="menu">
        <h4>Flow</h4>
        <img src="images.png" alt=""
        style="width: 20px; height: 20px;">
    </div>
</body>h1 huzaifa 

</html
