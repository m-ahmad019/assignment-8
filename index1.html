<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
        
             margin-right: 10%;
          margin-top: 30%;
          margin-left: 10%;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 70px;
            border: 1px solid black;
            border-radius: 10px;
            padding: 20px;
        }

        .nav-links ul {
            display: flex;
            list-style: none;
            gap: 50px;
        }

        .nav-links ul li a {
            text-decoration: none;
            color: black;

            /* gap: 10px; */
        }

        .nav-btn {
            padding: 20px;
        }

        .btn-1 {
            border: none;
            width: 70px;
            height: 40px;
        }

        .btn-2 {
            color: white;
            background-color: black;
            border-radius: 7px;
            border: none;
            width: 70px;
            height: 40px;
        }
    </style>
</head>

<body>
    <div class="navbar">
        <div class="logo">
            <h4>Shadcnblocks.com</h4>
        </div>
        <div class="nav-links">
            <ul>
                <li><a href="#">Products</a></li>
                <li><a href="#">Company</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>
        <div class="nav-btn">
            <button class="btn-1">Log in</button>
            <button class="btn-2">Sign up</button>
        </div>
    </div>
</body>

</html>
